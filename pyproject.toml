[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "play-annotation-generator"
version = "0.1.0"
description = "Play-Annotation-Generator: CVAT XML & MOT Track Action Enricher"
authors = [
    { name = "FilmBreakdownAI Developer" }
]
dependencies = [
    "PyYAML>=6.0"
]
requires-python = ">=3.10"

[project.scripts]
play-annotation-generator = "play_annotation_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
