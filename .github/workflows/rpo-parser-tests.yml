name: RPO parser regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/rpo-blocking-schemes-and-exclusions]

jobs:
  rpo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: RPO and existing parser regressions
        run: python -m pytest -q tests/test_rpo_blocking.py tests/test_wide_action_csv_parser.py
