        with:
          sparse-checkout: |
            src
            tests
            docs
            pyproject.toml
            data/actions.json
            data/plays.json
            data/DatasetSummary.csv
            data/rpo_excluded_video_ids.txt
            data/key_actions
            data/player_tracks
            data/migrations
            data/showcase
            data/tracking/OutsideZoneStretch
            data/tracking/OutsideZoneRead
            data/tracking/SplitZone
            data/tracking/InsideZoneStretch
            data/tracking/InsideZoneRead
            data/tracking/FieldGoalBlock
            data/tracking/BootPass/BootPass_1_cvat_mot.zip
            data/tracking/Counter/Counter_1_cvat_mot.zip
            data/tracking/Counter/Counter_2_cvat_mot.zip
            data/tracking/CrackToss/CrackToss_3_cvat_mot.zip
            data/tracking/CrackToss/CrackToss_4_cvat_mot.zip
            data/tracking/Dagger/Dagger_1_cvat_mot.zip
            data/tracking/DeepCross/DeepCross_1_cvat_mot.zip
            data/tracking/Draw/Draw_1_cvat_mot.zip
            data/tracking/Duo/Duo_clip1_cvat_mot.zip
            data/tracking/FieldGoalBlock/FieldGoalBlock_3_cvat_mot.zip
            data/tracking/FieldGoalBlock/FieldGoalBlock_4_cvat_mot.zip
            data/tracking/Hitch/Hitch_2_cvat_mot.zip
            data/tracking/InsideZoneRead/InsideZoneRead_1_cvat_mot.zip
            data/tracking/InsideZoneRead/InsideZoneRead_2_cvat_mot.zip
            data/tracking/InsideZoneStretch/InsideZoneStretch_1_cvat_mot.zip
            data/tracking/InsideZoneStretch/InsideZoneStretch_2_cvat_mot.zip
            data/tracking/JetSweep/JetSweep_1_cvat_mot.zip
            data/tracking/JetSweep/JetSweep_2_cvat_mot.zip
            data/tracking/KickoffReturnTouchdown/KickoffReturnTouchdown_17_cvat_mot.zip
            data/tracking/KickoffReturnTouchdown/KickoffReturnTouchdown_18_cvat_mot.zip
            data/tracking/OnsideKickRecovery/OnsideKickRecovery_1_cvat_mot.zip
            data/tracking/OnsideKickRecovery/OnsideKickRecovery_2_cvat_mot.zip
            data/tracking/OutAndUp/OutAndUp_3_cvat_mot.zip
            data/tracking/OutRoutes/OutRoutes_1_cvat_mot.zip
            data/tracking/OutRoutes/OutRoutes_2_cvat_mot.zip
            data/tracking/OutsideZoneRead/OutsideZoneRead_1_cvat_mot.zip
            data/tracking/OutsideZoneRead/OutsideZoneRead_2_cvat_mot.zip
