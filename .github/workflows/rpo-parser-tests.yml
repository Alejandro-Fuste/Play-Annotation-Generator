name: RPO parser regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/rpo-blocking-schemes-and-exclusions, fix/rpo-route-taxonomy-and-eligibility]

jobs:
  rpo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests
            data/actions.json
            data/key_actions/RPO.csv
            data/rpo_excluded_video_ids.txt
            data/plays.json
            docs/endOfPlayEventsShortHand.json
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: RPO and existing parser regressions
        run: python -m pytest -q tests/test_rpo_blocking.py tests/test_wide_action_csv_parser.py tests/test_showcase_readiness.py::test_rpo_presnap_boundary_and_coverage

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
