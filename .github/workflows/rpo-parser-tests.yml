            data/tracking/OutsideZoneStretch/OutsideZoneStretch_2_cvat_mot.zip
            data/tracking/PinAndPull/PinAndPull_1_cvat_mot.zip
            data/tracking/PinAndPull/PinAndPull_2_cvat_mot.zip
            data/tracking/Post10to15/Post10to15_1_cvat_mot.zip
            data/tracking/Power/Power_3_cvat_mot.zip
            data/tracking/Power/Power_4_cvat_mot.zip
            data/tracking/PuntBlock/PuntBlock_1_cvat_mot.zip
            data/tracking/PuntBlock/PuntBlock_2_cvat_mot.zip
