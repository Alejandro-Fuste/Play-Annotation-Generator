        run: python -m pytest -q tests/

  rpo-targeted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            data/actions.json
            data/plays.json
            data/DatasetSummary.csv
            data/key_actions/RPO.csv
            data/player_tracks/RPO.csv
            data/rpo_excluded_video_ids.txt
            data/tracking/RPO/RPO_30_cvat_mot.zip
            data/tracking/RPO/RPO_32_cvat_mot.zip
            data/tracking/RPO/RPO_37_cvat_mot.zip
            data/tracking/RPO/RPO_71_cvat_mot.zip
            data/tracking/RPO/RPO_165_cvat_mot.zip
            data/tracking/RPO/RPO_191_cvat_mot.zip
            data/tracking/RPO/RPO_254_cvat_mot.zip
            docs/JetSweepTemplate.xml
            docs/endOfPlayEventsShortHand.json
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Targeted RPO batch
        run: |
          python -m play_annotation_generator.cli batch-generate-and-enrich \
            --gt-dir data/tracking/RPO \
            --template docs/JetSweepTemplate.xml \
            --key-actions data/key_actions/RPO.csv \
            --player-tracks data/player_tracks/RPO.csv \
            --dataset-summary data/DatasetSummary.csv \
            --actions-json data/actions.json \
            --plays-json data/plays.json \
            --output outputs/batch/RPOTargeted \
            --play RPO \
            --video-id 30,32,37,71,165,191,254 \
            --exclude-video-ids-file data/rpo_excluded_video_ids.txt \
            --review
      - name: Verify seven corrected clips, Route metadata and Z/G/P scheme
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          expected_routes = {
              "30": "Action_RunWheelRoute",
              "32": "Action_RunHitchGoRoute",
              "71": "Action_RunInRoute",
              "165": "Action_RunSlantGoRoute",
              "191": "Action_RunCornerRoute",
          }
          root = Path("outputs/batch/RPOTargeted")
          manifest = json.loads((root / "_batch" / "batch_manifest.json").read_text())
          items = manifest["results"]
          assert len(items) == 7, len(items)
          for row in items:
              assert row["execution_state"] == "PROCESSED", row
              assert row["status"] in ("PASS", "WARNING"), row
              clip = row["clip_name"]
              path = root / "RPO" / clip / "annotations.json"
              assert path.exists(), clip
              annotations = json.loads(path.read_text())
              segments = annotations["actions"]["segments"]
              ol = {s["position"] for s in segments if s.get("blocking_scheme")}
              assert ol == {"LT", "LG", "C", "RG", "RT"}, (clip, ol)
              video_id = row["video_id"]
              if video_id in expected_routes:
                  routes = annotations["actions"]["non_temporal_action_descriptors"]
                  assert any(r["canonical_action"] == expected_routes[video_id]
                             for r in routes), (clip, routes)
              if video_id == "37":
                  assert any(s.get("blocking_scheme") == "zone" for s in segments)
              print(clip, row["status"], row["warning_count"], sorted(ol))
          assert any(row["video_id"] == "254" for row in items)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpo-targeted-smoke
          path: outputs/batch/RPOTargeted
          if-no-files-found: warn

  rpo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            data/actions.json
            data/plays.json
            data/DatasetSummary.csv
            data/key_actions/RPO.csv
            data/player_tracks/RPO.csv
            data/rpo_excluded_video_ids.txt
            data/tracking/RPO/RPO_1_cvat_mot.zip
            data/tracking/RPO/RPO_3_cvat_mot.zip
            data/tracking/RPO/RPO_5_cvat_mot.zip
            data/tracking/RPO/RPO_7_cvat_mot.zip
            data/tracking/RPO/RPO_9_cvat_mot.zip
            data/tracking/RPO/RPO_22_cvat_mot.zip
            docs/JetSweepTemplate.xml
            docs/endOfPlayEventsShortHand.json
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Process five RPO tracking clips
        run: |
          python -m play_annotation_generator.cli batch-generate-and-enrich \
            --gt-dir data/tracking/RPO \
            --template docs/JetSweepTemplate.xml \
            --key-actions data/key_actions/RPO.csv \
            --player-tracks data/player_tracks/RPO.csv \
            --dataset-summary data/DatasetSummary.csv \
            --actions-json data/actions.json \
            --plays-json data/plays.json \
            --output outputs/batch/RPOSmoke \
            --play RPO \
            --video-id 1,3,5,7,22 \
            --exclude-video-ids-file data/rpo_excluded_video_ids.txt \
            --review
      - name: Print batch manifest outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("outputs/batch/RPOSmoke/_batch/batch_manifest.json")
          if not path.exists():
              print("No manifest produced")
          else:
              data = json.loads(path.read_text())
              entries = data.get("results", []) if isinstance(data, dict) else data
              for item in entries:
                  print(item.get("clip_name"), item.get("status"), item.get("failure_type"), item.get("message"))
              excluded = [item for item in entries if item.get("status") == "EXCLUDED"]
              assert len(excluded) == 1 and excluded[0].get("video_id") == "9", excluded
              assert len([item for item in entries if item.get("execution_state") == "PROCESSED"]) == 5
          PY
      - name: Verify real clip blocking schemes and exported segments
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          expected = {1: "gap", 3: "gap", 5: "zone", 7: "zone", 22: "pass"}
          for vid, scheme in expected.items():
              root = Path(f"outputs/batch/RPOSmoke/RPO/RPO_{vid}")
              path = root / "annotations.json"
              assert path.is_file(), f"Missing RPO_{vid} annotations.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              segments = data.get("actions", {}).get("segments", [])
              found = [s for s in segments if s.get("blocking_scheme") == scheme]
              positions = sorted(set(s.get("position") for s in found))
              print(f"RPO_{vid}: scheme={scheme} segments={len(found)} positions={positions}")
              assert set(positions) == {"LT", "LG", "C", "RG", "RT"}, (
                  f"RPO_{vid} missing expected 5 OL scheme annotations: {positions}"
              )
              report = root / "validation_report.json"
              if report.exists():
                  metrics = json.loads(report.read_text(encoding="utf-8"))
                  warnings = metrics.get("warnings", [])
                  print(f"RPO_{vid}: warning count={len(warnings)}, first warnings={warnings[:3]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpo-five-clip-smoke
          path: outputs/batch/RPOSmoke
          if-no-files-found: warn
